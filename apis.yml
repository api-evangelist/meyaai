aid: meyaai
name: Meya.ai
description: >-
  Meya is a chatbot and CX-automation platform for building, coding, and launching customer-support
  conversational apps, digital assistants, and workflow automation. Developers use the Grid platform
  and Console to script flows in BFML (a YAML syntax with Jinja2 templating) and Python 3 with async
  I/O, embed the Meya Orb chat UI on web and mobile, and connect messaging, support, NLU, and analytics
  integrations (WhatsApp, Facebook Messenger, Twilio, Zendesk, Front, Salesforce, Dialogflow, Wit.ai,
  Segment). The platform exposes an HTTP gateway for inbound integration/API webhooks, a first-party
  Meya CLI for local development with live push, and the Orb SDKs for web, Flutter, and iOS.
